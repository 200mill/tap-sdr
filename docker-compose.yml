services:
  rtltcp:
    image: docker.io/kosdk/rtl-tcp
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "1234:1234"
    restart: unless-stopped

  sdr-tap:
    build: .
    env_file: .env
    environment:
      SDR_TAP_ID: ${SDR_TAP_ID}
      SDR_API_TOKEN: ${SDR_API_TOKEN}
      SDR_CENTER_MHZ: ${SDR_CENTER_MHZ:-98.0}
      TAPHUB_ENDPOINT: ${TAPHUB_ENDPOINT:-api.zako.ac}
      RTLTCP_HOST: rtltcp
      RTLTCP_PORT: "1234"
    depends_on:
      - rtltcp
    restart: unless-stopped
