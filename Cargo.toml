[workspace]
members = ["."]
exclude = ["references"]
resolver = "2"

[workspace.dependencies]
actix-web = "4"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["cargo", "env"] }
dotenvy = "0.15"
exitcode = "1"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ogg = { version = "0.9", features = ["async"] }
tokio-stream = "0.1"
zako3-tap-sdk = { git = "https://github.com/zako-ac/zako3", features = ["healthcheck"] }

[package]
name = "sdr-tap"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ogg = { workspace = true }
tokio-stream = { workspace = true }
zako3-tap-sdk = { workspace = true }

[patch.crates-io.protofish2]
git = "https://github.com/mincomk/protofish2-rs"
branch = "main"
